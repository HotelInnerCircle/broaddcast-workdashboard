<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WorkPulse is offline</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f4f0e8; color: #2a2620; padding: 24px;
    font-family: "DM Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .card { max-width: 420px; width: 100%; text-align: center; background: #fbf9f5;
    border: 1px solid #e6dfd2; border-radius: 22px; padding: 40px 32px; }
  .mark { width: 62px; height: 62px; margin: 0 auto 20px; border-radius: 999px;
    background: #8a5a3c; color: #fff; display: grid; place-items: center;
    font-size: 21px; font-weight: 700; letter-spacing: .5px; }
  h1 { margin: 0 0 10px; font-size: 21px; }
  p { margin: 0 0 6px; font-size: 14px; line-height: 1.55; color: #6b6355; }
  code { font-size: 12px; color: #8f877a; word-break: break-all; }
  button { margin-top: 24px; width: 100%; height: 46px; border: 0; border-radius: 999px;
    background: #8a5a3c; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:hover { background: #7a4e33; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">WP</div>
    <h1>Can't reach WorkPulse</h1>
    <p>You appear to be offline, or the server is not responding right now.</p>
    <p><code id="reason"></code></p>
    <button id="retry" type="button">Try again</button>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const url = params.get("url") || "https://app.broaddcast.com";
  const reason = params.get("reason");
  if (reason) document.getElementById("reason").textContent = reason;
  document.getElementById("retry").addEventListener("click", () => { location.href = url; });
  // Come back by itself the moment the network returns.
  window.addEventListener("online", () => { location.href = url; });
</script>
</body>
</html>
