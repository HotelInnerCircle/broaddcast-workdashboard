# Builds the installable apps (A82).
#
# Neither app can be built on the owner's PC: there is no JDK or Android SDK there, and Windows
# refuses electron-builder's signing-tool unpack without Developer Mode. GitHub's runners have all
# of it, and Actions is free for this repo, so the apps are built here instead.
#
# Run it from the Actions tab (Run workflow), or push a tag like v1.0.0 to also publish a release
# with both files attached.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    # The signing secrets are lifted to the job so a step's `if` can test them: the `secrets`
    # context is not available in `steps[*].if`, only `env` is. Using it there makes the whole
    # workflow file invalid, which fails the run before a single step starts.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci

      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      # v3 still asked for the obsolete `tools` package, which Google no longer serves - sdkmanager
      # exits 1 with "Failed to find package 'tools'" and the job dies before Gradle ever starts.
      # v4 dropped it from the defaults; the platform this build compiles against is named outright
      # so it does not depend on what the runner image happens to ship.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Record the toolchain
        if: always()
        run: |
          {
            echo "### Toolchain"
            echo '```'
            echo "node    $(node -v)"
            echo "java    $(java -version 2>&1 | head -1)"
            echo "sdk     ${ANDROID_HOME:-unset}"
            echo "platforms: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | xargs)"
            echo "build-tools: $(ls "$ANDROID_HOME/build-tools" 2>/dev/null | xargs)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Firebase, or no push plugin at all - never one without the other.
      #
      # The push plugin's register() calls FirebaseMessaging.getInstance(). Without a
      # google-services.json that throws, and Capacitor rethrows any plugin exception as a
      # RuntimeException on the main handler (Bridge.callPluginMethod), which kills the app. An APK
      # carrying the plugin but no Firebase config therefore closes itself seconds after launch.
      - name: Firebase config, or build without push
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase configured - this build has push notifications"
          else
            npm uninstall --no-save @capacitor/push-notifications
            echo "No GOOGLE_SERVICES_JSON secret - building without the push plugin"
          fi

      # Writes the native config from capacitor.config.ts (the URL the shell loads).
      - run: npx cap sync android

      - name: Record which plugins went in
        run: |
          {
            echo "### Plugins in this build"
            echo '```'
            cat android/app/src/main/assets/capacitor.plugins.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A signed release APK when the keystore secrets are set, otherwise a debug APK - which is
      # still installable. An *unsigned* release APK is not, so debug is the right fallback.
      - name: Restore the signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/workpulse.keystore
          {
            echo "storeFile=workpulse.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ -f key.properties ]; then task=assembleRelease; else task=assembleDebug; fi
          ./gradlew "$task" --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      # Put the error on the run's Summary page: reading it should not mean hunting through logs.
      - name: Show what failed
        if: failure()
        run: |
          {
            echo "### Android build failed"
            echo '```'
            if [ -s gradle.log ]; then tail -n 60 gradle.log
            else echo "Gradle produced no output - the failure is in a step before the build."; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the APK
        run: |
          mkdir -p out
          apk="$(find android/app/build/outputs/apk -name '*.apk' | head -1)"
          if [ -z "$apk" ]; then echo "No APK was produced"; exit 1; fi
          cp "$apk" out/WorkPulse.apk
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-android
          path: out/WorkPulse.apk
          retention-days: 90

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: WorkPulse-windows
          path: desktop/dist/*.exe
          retention-days: 90

  release:
    name: Publish the release
    needs: [android, windows]
    # Publish whatever built. The download page is per-platform, so one working app should reach
    # people rather than waiting for the other one to be fixed.
    if: >-
      ${{ always() && startsWith(github.ref, 'refs/tags/v')
      && (needs.android.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files }
        continue-on-error: true
      - run: ls -R files

      # The download page reads these assets through the API and redirects to a signed URL, so a
      # private repo still hands the files out without asking anyone to sign in.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            files/**/*.apk
            files/**/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
